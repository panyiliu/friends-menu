<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>朋友聚餐 | 至臻点餐体验</title>
    <!-- 预连接 & 高级字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 自定义高级样式覆盖 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FEF9F0;
            background-image: radial-gradient(circle at 15% 30%, rgba(255, 235, 205, 0.5) 0%, #FFF8F0 70%, #FFFFFF 100%);
            scroll-behavior: smooth;
        }

        /* 精致滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #F0E7DC;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D9B48B;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C87E3A;
        }

        /* 玻璃拟态工具类 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 245, 225, 0.9);
        }
        .glass-nav {
            background: rgba(255, 253, 245, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 分类导航动态下划线 */
        .category-slider {
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .category-btn {
            transition: all 0.25s ease;
            letter-spacing: -0.01em;
            position: relative;
        }
        .category-btn::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 24px;
            height: 3px;
            background: linear-gradient(135deg, #F97316, #EA580C);
            border-radius: 4px;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .category-btn.active {
            color: #EA580C;
            font-weight: 600;
            background: transparent;
            box-shadow: none;
        }
        .category-btn.active::after {
            transform: translateX(-50%) scaleX(1);
        }
        /* 移动端胶囊备用风格增强 */
        @media (max-width: 640px) {
            .category-btn::after {
                width: 20px;
                bottom: -4px;
            }
        }

        /* 精致菜品卡片 */
        .dish-card {
            background: #FFFFFF;
            border-radius: 28px;
            transition: all 0.4s cubic-bezier(0.15, 0.75, 0.4, 1);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0,0,0,0.02);
            border: 1px solid rgba(253, 230, 200, 0.7);
        }
        .dish-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 36px -14px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0,0,0,0.02);
            border-color: #FFE0B5;
        }
        .dish-img {
            background: linear-gradient(145deg, #FFF3E6, #FFEAD4);
            transition: all 0.3s;
        }
        .add-btn {
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .add-btn:active {
            transform: scale(0.96);
        }

        /* 购物车抽屉高级感 */
        .cart-drawer-panel {
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-drawer-panel.open {
            transform: translateX(0);
        }
        .cart-item {
            transition: all 0.2s;
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #FCEBD9;
        }

        /* 底部模糊遮罩 */
        .drawer-overlay {
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        .drawer-overlay.active {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0s;
        }

        /* 浮动购物车徽章动画 */
        .cart-badge-pulse {
            animation: gentlePulse 0.5s cubic-bezier(0.2, 0.9, 0.6, 1.1);
        }
        @keyframes gentlePulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.25); background: #F97316; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 输入框高级样式 */
        .premium-input {
            background: #FFFFFF;
            border: 1px solid #F2E0CF;
            border-radius: 24px;
            transition: all 0.2s;
        }
        .premium-input:focus {
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
            outline: none;
        }

        /* 平滑滚动偏移 */
        .scroll-mt-offset {
            scroll-margin-top: 88px;
        }

        /* 微光效果 */
        .shimmer-light {
            background: linear-gradient(105deg, transparent 30%, rgba(255,245,215,0.5) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmerMove 2s infinite;
        }
        @keyframes shimmerMove {
            0% { background-position: 120% 0; }
            100% { background-position: -120% 0; }
        }

        /* 分类滚动条隐藏优雅滚动 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 响应式微调: 移动端双列卡片 */
        @media (max-width: 640px) {
            .dish-card {
                border-radius: 24px;
            }
        }
    </style>
</head>
<body class="antialiased">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 md:py-8 relative">
        <!-- 精致头部 -->
        <div class="flex justify-between items-end mb-8 flex-wrap gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-8 bg-gradient-to-b from-orange-400 to-amber-500 rounded-full"></div>
                    <h1 class="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-stone-800 via-amber-800 to-orange-700 bg-clip-text text-transparent">朋友·聚</h1>
                </div>
                <p class="text-stone-500 text-sm flex items-center gap-2 mt-1"><i class="fa-regular fa-clock text-amber-500"></i> 欢聚时刻 · 臻选风味</p>
            </div>
            <button id="orderHistoryBtn" class="group flex items-center gap-2 bg-white/60 backdrop-blur-sm border border-stone-200/80 rounded-full px-4 py-2 text-sm font-medium text-stone-600 hover:bg-white hover:shadow-md transition-all duration-300 hover:border-amber-300">
                <i class="fa-regular fa-note-sticky group-hover:text-amber-600"></i>
                <span>我的订单</span>
            </button>
        </div>

        <!-- 高级分类导航栏 (横向滑动 + 优雅下划线) -->
        <div class="sticky top-4 z-20 mb-8">
            <div class="glass-nav rounded-2xl shadow-sm py-2 px-1 border border-white/40">
                <div id="categoryNav" class="flex overflow-x-auto no-scrollbar snap-x gap-1 px-2 scroll-smooth">
                    <!-- JS 动态生成分类按钮 -->
                </div>
            </div>
        </div>

        <!-- 菜品网格容器 -->
        <div id="menuContainer" class="space-y-10 pb-12">
            <!-- 动态渲染每个分类区块 -->
        </div>

        <!-- 悬浮购物车按钮 (高级玻璃质感) -->
        <div class="fixed bottom-7 right-6 z-30">
            <button id="cartFloatBtn" class="relative bg-gradient-to-br from-orange-500 to-amber-600 w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-white text-xl transition-all duration-300 hover:scale-105 active:scale-95 hover:shadow-orange-300/40 focus:outline-none group">
                <i class="fas fa-shopping-bag text-xl drop-shadow-sm"></i>
                <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[11px] font-bold rounded-full min-w-[22px] h-[22px] flex items-center justify-center px-1 shadow-md ring-2 ring-white/60">0</span>
                <div class="absolute inset-0 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-white/20 blur-sm"></div>
            </button>
        </div>

        <!-- 购物车抽屉 (右侧高级滑出) -->
        <div id="cartOverlay" class="drawer-overlay fixed inset-0 z-40 invisible opacity-0 bg-black/30 backdrop-blur-sm transition-all duration-300">
            <div id="cartDrawer" class="cart-drawer-panel fixed top-0 right-0 h-full w-full max-w-md bg-white/98 shadow-2xl transform translate-x-full flex flex-col overflow-hidden rounded-l-3xl border-l border-amber-100/80">
                <!-- 头部 -->
                <div class="flex items-center justify-between p-6 border-b border-amber-100/60 bg-gradient-to-r from-orange-50/80 to-amber-50/80">
                    <h3 class="text-xl font-bold text-stone-800 flex items-center gap-2"><i class="fas fa-clipboard-list text-amber-600"></i> 点餐清单</h3>
                    <button id="closeCartBtn" class="w-9 h-9 rounded-full bg-white/80 text-stone-500 hover:bg-stone-100 transition flex items-center justify-center shadow-sm"><i class="fas fa-times"></i></button>
                </div>
                <!-- 购物车列表区域 -->
                <div id="cartItemsList" class="flex-1 overflow-y-auto p-5 space-y-3">
                    <div class="text-center text-stone-400 py-14 flex flex-col items-center gap-2"><i class="fa-regular fa-cart-circle-xmark text-4xl opacity-40"></i><p class="text-sm">菜单空置 · 选几道挚爱吧</p></div>
                </div>
                <!-- 订单详情栏 -->
                <div class="border-t border-stone-100/80 p-6 bg-stone-50/40 rounded-t-3xl">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-stone-600 font-medium">合计金额</span>
                        <span id="cartTotalPrice" class="text-orange-600 text-2xl font-bold tracking-tight">¥0</span>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="customerName" placeholder="点餐人姓名" class="premium-input w-full px-4 py-3 text-sm font-medium placeholder:text-stone-400">
                        <input type="text" id="visitTime" placeholder="预计到访时间 (例如 19:00)" class="premium-input w-full px-4 py-3 text-sm">
                        <textarea id="remark" rows="2" placeholder="特殊要求 / 忌口 / 加辣" class="premium-input w-full px-4 py-3 text-sm resize-none"></textarea>
                        <button id="submitOrderBtn" class="w-full bg-gradient-to-r from-stone-800 to-stone-900 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2 mt-2 group"><i class="fas fa-paper-plane group-hover:translate-x-1 transition"></i> 优雅提交菜单</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 轻提示 -->
    <div id="toastMessage" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-stone-800 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-xl z-50 opacity-0 transition-all duration-300 pointer-events-none backdrop-blur-sm bg-opacity-90 whitespace-nowrap"></div>

    <script>
        // ---------- 高级菜单数据 (精致组合) ----------
        const RAW_DISHES = [
            { id: 1, name: "扬州炒饭", category: "中餐", price: 28, icon: "fa-regular fa-cup-straw", emoji: "🍚", gradient: "from-amber-100/80 to-orange-100/80" },
            { id: 2, name: "宫保鸡丁", category: "热菜", price: 42, icon: "fa-regular fa-chicken", emoji: "🍗", gradient: "from-red-100/70 to-rose-100/70" },
            { id: 3, name: "松鼠桂鱼", category: "热菜", price: 68, icon: "fa-regular fa-fish", emoji: "🐟", gradient: "from-sky-100/70 to-blue-100/60" },
            { id: 4, name: "酸辣土豆丝", category: "凉菜", price: 16, icon: "fa-regular fa-pepper-hot", emoji: "🥔", gradient: "from-lime-100/60 to-green-100/60" },
            { id: 5, name: "桂花糯米藕", category: "凉菜", price: 22, icon: "fa-regular fa-flower", emoji: "🪷", gradient: "from-purple-100/60 to-pink-100/60" },
            { id: 6, name: "番茄蛋花汤", category: "汤品", price: 18, icon: "fa-regular fa-mug-hot", emoji: "🍅", gradient: "from-yellow-100/60 to-orange-100/60" },
            { id: 7, name: "毛血旺", category: "热菜", price: 58, icon: "fa-regular fa-pepper", emoji: "🌶️", gradient: "from-red-200/70 to-orange-200/70" },
            { id: 8, name: "夫妻肺片", category: "凉菜", price: 35, icon: "fa-regular fa-bowl-food", emoji: "🥩", gradient: "from-stone-100 to-neutral-100" },
            { id: 9, name: "蒜蓉西兰花", category: "热菜", price: 22, icon: "fa-regular fa-leaf", emoji: "🥦", gradient: "from-emerald-100/70 to-teal-100/60" },
            { id: 10, name: "冰镇酸梅汤", category: "汤品", price: 12, icon: "fa-regular fa-wine-bottle", emoji: "🍹", gradient: "from-indigo-100/60 to-blue-100/60" },
            { id: 11, name: "葱油拌面", category: "中餐", price: 18, icon: "fa-regular fa-utensils", emoji: "🍜", gradient: "from-amber-50 to-yellow-100/70" },
            { id: 12, name: "秘制烤翅", category: "热菜", price: 32, icon: "fa-regular fa-drumstick-bite", emoji: "🍖", gradient: "from-orange-100 to-amber-100" },
            { id: 13, name: "山城辣子鸡", category: "热菜", price: 48, icon: "fa-regular fa-pepper-hot", emoji: "🐔", gradient: "from-red-200 to-orange-200" },
            { id: 14, name: "翡翠虾仁", category: "热菜", price: 56, icon: "fa-regular fa-shrimp", emoji: "🦐", gradient: "from-teal-100/70 to-emerald-100" },
            { id: 15, name: "蒜泥白肉", category: "凉菜", price: 32, icon: "fa-regular fa-bacon", emoji: "🥓", gradient: "from-amber-100/60 to-stone-100" }
        ];

        // 分类顺序 + 分组
        const CATEGORY_ORDER = ["中餐", "凉菜", "热菜", "汤品"];
        let groupedDishes = {};
        CATEGORY_ORDER.forEach(cat => {
            groupedDishes[cat] = RAW_DISHES.filter(d => d.category === cat);
        });

        // 购物车数据
        let cart = [];

        // DOM 元素
        const menuContainer = document.getElementById('menuContainer');
        const categoryNav = document.getElementById('categoryNav');
        const cartFloatBtn = document.getElementById('cartFloatBtn');
        const cartCountBadge = document.getElementById('cartCountBadge');
        const cartOverlay = document.getElementById('cartOverlay');
        const cartDrawer = document.getElementById('cartDrawer');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartItemsList = document.getElementById('cartItemsList');
        const cartTotalPriceSpan = document.getElementById('cartTotalPrice');
        const submitBtn = document.getElementById('submitOrderBtn');
        const customerName = document.getElementById('customerName');
        const visitTime = document.getElementById('visitTime');
        const remarkArea = document.getElementById('remark');
        const toastEl = document.getElementById('toastMessage');

        function showToast(text, duration = 1800) {
            toastEl.innerText = text;
            toastEl.classList.remove('opacity-0');
            toastEl.classList.add('opacity-100');
            setTimeout(() => {
                toastEl.classList.remove('opacity-100');
                toastEl.classList.add('opacity-0');
            }, duration);
        }

        // 更新购物车角标 & 存储
        function updateCartBadge() {
            const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
            cartCountBadge.innerText = totalQty;
            if (totalQty > 0) {
                cartCountBadge.classList.add('cart-badge-pulse');
                setTimeout(() => cartCountBadge.classList.remove('cart-badge-pulse'), 400);
            }
            localStorage.setItem('premium_dinner_cart', JSON.stringify(cart));
        }

        // 渲染购物车侧边栏
        function renderCartDrawer() {
            if (cart.length === 0) {
                cartItemsList.innerHTML = `<div class="text-center text-stone-400 py-14 flex flex-col items-center gap-2"><i class="fa-regular fa-cart-circle-xmark text-4xl opacity-40"></i><p class="text-sm">菜单空置 · 选几道挚爱吧</p></div>`;
                cartTotalPriceSpan.innerText = `¥0`;
                return;
            }
            let total = 0;
            let itemsHtml = `<div class="space-y-3">`;
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                itemsHtml += `
                    <div class="cart-item p-3 flex items-center gap-3 transition-all">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${item.gradient} flex items-center justify-center text-xl shadow-inner">
                            <i class="${item.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-semibold text-stone-800">${item.name}</p>
                            <p class="text-xs text-stone-500">¥${item.price}</p>
                        </div>
                        <div class="flex items-center gap-1 bg-stone-50/90 rounded-full p-1 border border-stone-100">
                            <button data-id="${item.id}" data-action="decr" class="cart-qty w-7 h-7 rounded-full bg-white shadow-sm text-stone-600 hover:bg-amber-50 transition flex items-center justify-center text-sm font-bold">−</button>
                            <span class="w-6 text-center font-medium text-stone-700 text-sm">${item.quantity}</span>
                            <button data-id="${item.id}" data-action="incr" class="cart-qty w-7 h-7 rounded-full bg-white shadow-sm text-stone-600 hover:bg-amber-50 transition flex items-center justify-center text-sm font-bold">+</button>
                        </div>
                        <button data-id="${item.id}" data-action="remove" class="cart-remove text-stone-400 hover:text-rose-500 transition w-7 h-7 rounded-full flex items-center justify-center"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                `;
            });
            itemsHtml += `</div>`;
            cartItemsList.innerHTML = itemsHtml;
            cartTotalPriceSpan.innerText = `¥${total}`;

            // 绑定购物车内动态按钮
            document.querySelectorAll('.cart-qty').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    const action = btn.dataset.action;
                    const idx = cart.findIndex(i => i.id === id);
                    if (idx !== -1) {
                        if (action === 'incr') {
                            cart[idx].quantity += 1;
                            showToast(`➕ ${cart[idx].name}  +1`, 600);
                        } else if (action === 'decr') {
                            if (cart[idx].quantity > 1) {
                                cart[idx].quantity -= 1;
                                showToast(`➖ ${cart[idx].name}  -1`, 600);
                            } else {
                                const removed = cart.splice(idx, 1)[0];
                                showToast(`🗑️ 移除 ${removed.name}`, 800);
                            }
                        }
                        updateCartBadge();
                        renderCartDrawer();
                        renderMenuItems();   // 刷新所有菜品按钮文字
                    }
                });
            });
            document.querySelectorAll('.cart-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    const index = cart.findIndex(i => i.id === id);
                    if (index !== -1) {
                        const removed = cart.splice(index, 1)[0];
                        showToast(`✖️ 已删除 ${removed.name}`, 900);
                        updateCartBadge();
                        renderCartDrawer();
                        renderMenuItems();
                    }
                });
            });
        }

        // 加入购物车逻辑
        function addToCart(dish) {
            const existing = cart.find(i => i.id === dish.id);
            if (existing) {
                existing.quantity += 1;
                showToast(`🍽️ ${dish.name} 数量 +1`, 700);
            } else {
                cart.push({
                    id: dish.id,
                    name: dish.name,
                    price: dish.price,
                    quantity: 1,
                    icon: dish.icon,
                    gradient: dish.gradient,
                    emoji: dish.emoji
                });
                showToast(`✨ 添加 ${dish.name} 至菜单`, 1000);
            }
            updateCartBadge();
            renderCartDrawer();
            renderMenuItems();  // 刷新按钮文本
        }

        // 渲染菜品区域 (移动端双列/桌面三列高级布局)
        function renderMenuItems() {
            let fullHtml = '';
            for (let cat of CATEGORY_ORDER) {
                const items = groupedDishes[cat] || [];
                if (items.length === 0) continue;
                fullHtml += `
                    <div id="cat-${cat}" class="scroll-mt-offset">
                        <div class="flex items-center gap-2 mb-4 px-1">
                            <div class="w-1.5 h-6 bg-orange-400 rounded-full"></div>
                            <h2 class="text-xl font-semibold tracking-tight text-stone-800">${cat}</h2>
                            <span class="text-xs font-medium text-stone-400 bg-stone-100/70 px-2 py-0.5 rounded-full">${items.length}</span>
                        </div>
                        <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
                `;
                items.forEach(dish => {
                    const cartItem = cart.find(i => i.id === dish.id);
                    const btnText = cartItem ? `<i class="fas fa-check-circle text-xs mr-1"></i> 已选 ${cartItem.quantity}` : `<i class="fas fa-plus-circle mr-1"></i> 加入`;
                    fullHtml += `
                        <div class="dish-card p-3 flex flex-col">
                            <div class="dish-img w-full aspect-square rounded-2xl bg-gradient-to-br ${dish.gradient} flex items-center justify-center text-5xl shadow-inner mb-3 transition-all group-hover:scale-105">
                                <span class="drop-shadow-sm">${dish.emoji}</span>
                            </div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-stone-800 text-base">${dish.name}</h3>
                                    <p class="text-orange-500 font-semibold text-sm mt-0.5">¥${dish.price}</p>
                                </div>
                                <button data-id="${dish.id}" data-name="${dish.name}" data-price="${dish.price}" data-icon="${dish.icon}" data-grad="${dish.gradient}" class="add-dish-btn bg-stone-800 hover:bg-orange-600 text-white rounded-xl px-3 py-1.5 text-xs font-medium transition-all duration-200 flex items-center gap-1 shadow-sm">${btnText}</button>
                            </div>
                        </div>
                    `;
                });
                fullHtml += `</div></div>`;
            }
            menuContainer.innerHTML = fullHtml;

            // 绑定所有添加按钮
            document.querySelectorAll('.add-dish-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    const name = btn.dataset.name;
                    const price = parseFloat(btn.dataset.price);
                    const icon = btn.dataset.icon;
                    const grad = btn.dataset.grad;
                    addToCart({ id, name, price, icon, gradient: grad, emoji: '' });
                });
            });
        }

        // 构建分类导航 (带active高亮下划线)
        function buildCategoryNavbar() {
            const nav = categoryNav;
            nav.innerHTML = '';
            CATEGORY_ORDER.forEach(cat => {
                if (groupedDishes[cat]?.length) {
                    const btn = document.createElement('button');
                    btn.innerText = cat;
                    btn.setAttribute('data-category', cat);
                    btn.className = `category-btn px-5 py-2 text-sm font-medium text-stone-600 whitespace-nowrap transition-all`;
                    btn.addEventListener('click', () => {
                        const target = document.getElementById(`cat-${cat}`);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                    nav.appendChild(btn);
                }
            });
            // 滚动监听激活对应导航下划线
            const sections = CATEGORY_ORDER.map(cat => document.getElementById(`cat-${cat}`)).filter(Boolean);
            const observer = new IntersectionObserver((entries) => {
                let activeCat = null;
                for (let entry of entries) {
                    if (entry.isIntersecting) {
                        activeCat = entry.target.id.replace('cat-', '');
                        break;
                    }
                }
                if (activeCat) {
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        if (btn.dataset.category === activeCat) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            }, { threshold: 0.3, rootMargin: "-70px 0px -30% 0px" });
            sections.forEach(s => observer.observe(s));
        }

        // 提交订单
        function submitOrder() {
            const name = customerName.value.trim();
            if (!name) {
                showToast('请填写点餐人姓名', 1200);
                customerName.focus();
                return;
            }
            if (cart.length === 0) {
                showToast('菜单还是空的，请先添加菜品', 1200);
                return;
            }
            const timeVal = visitTime.value.trim() || "待定";
            const remarkVal = remarkArea.value.trim() || "无";
            const details = cart.map(i => `${i.name} x${i.quantity}`).join('、');
            const totalSum = cart.reduce((s,i) => s + i.price * i.quantity, 0);
            alert(`✅ 订单已优雅送达厨房\n\n🍽️ 点餐人：${name}\n🕒 时间：${timeVal}\n📝 备注：${remarkVal}\n📋 清单：${details}\n💰 总计：¥${totalSum}\n\n感谢使用朋友·聚，美味即刻呈现`);
            showToast(`🎉 菜单已提交，${name} 请慢用`, 2200);
            cart = [];
            updateCartBadge();
            renderCartDrawer();
            renderMenuItems();
            customerName.value = '';
            visitTime.value = '';
            remarkArea.value = '';
            closeCartDrawer();
        }

        function openCartDrawer() {
            cartOverlay.classList.add('active');
            cartDrawer.classList.add('open');
            document.body.style.overflow = 'hidden';
            renderCartDrawer();
        }
        function closeCartDrawer() {
            cartOverlay.classList.remove('active');
            cartDrawer.classList.remove('open');
            document.body.style.overflow = '';
        }

        cartFloatBtn.addEventListener('click', openCartDrawer);
        closeCartBtn.addEventListener('click', closeCartDrawer);
        cartOverlay.addEventListener('click', (e) => {
            if (e.target === cartOverlay) closeCartDrawer();
        });
        submitBtn.addEventListener('click', submitOrder);
        document.getElementById('orderHistoryBtn').addEventListener('click', () => showToast('订单记录即将开放 · 敬请期待', 1500));

        // 加载本地存储
        function loadStorage() {
            const saved = localStorage.getItem('premium_dinner_cart');
            if (saved) {
                try {
                    cart = JSON.parse(saved);
                    updateCartBadge();
                    renderCartDrawer();
                    renderMenuItems();
                } catch(e) {}
            }
        }

        // 初始化
        function init() {
            renderMenuItems();
            buildCategoryNavbar();
            loadStorage();
            renderCartDrawer();
        }
        init();
    </script>
</body>
</html>
