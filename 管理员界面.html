<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>朋友聚 · 管理后台 | 臻选美味控制台</title>
    <!-- Google Fonts & TailwindCSS & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 10% 20%, #fff9ef 0%, #fff5e8 35%, #ffffff 100%);
            scroll-behavior: smooth;
        }

        /* 自定义滚动条优雅 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0ede8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D9B48B;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c07e40;
        }

        /* 高级玻璃拟态卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 245, 225, 0.6);
        }
        .admin-card {
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .admin-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
            border-color: #FFE3B8;
        }

        /* 菜品状态切换按钮 */
        .toggle-status {
            transition: all 0.2s ease;
        }
        .toggle-status.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 筛选高亮 */
        .filter-input {
            transition: all 0.2s;
        }
        .filter-input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
            outline: none;
        }

        /* 分类徽章 */
        .category-badge {
            background: linear-gradient(135deg, #fef3e2, #fff7ed);
            border-left: 3px solid #f97316;
        }

        /* 悬浮菜单标签 */
        .nav-tab {
            transition: all 0.2s ease;
        }
        .nav-tab.active {
            background: #1f2937;
            color: white;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="antialiased">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 relative">
        <!-- 头部区域: 高级管理标题 -->
        <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <div class="relative">
                <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-stone-800 via-amber-700 to-orange-600 bg-clip-text text-transparent">
                    朋友聚 · 御膳房
                </h1>
                <div class="absolute -top-4 -left-8 w-28 h-28 bg-amber-200/30 rounded-full blur-3xl -z-10"></div>
                <p class="text-sm text-stone-500 mt-1 flex items-center gap-1"><i class="fas fa-crown text-amber-500 text-xs"></i> 后厨管理控制台 · 臻选风味</p>
            </div>
            <div class="flex gap-2">
                <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm"><i class="fas fa-check-circle"></i> 运营中</span>
            </div>
        </div>

        <!-- 选项卡 + 快捷操作栏 -->
        <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
            <div class="flex bg-white/70 backdrop-blur-sm p-1 rounded-2xl shadow-sm border border-stone-100">
                <button data-tab="menu" class="nav-tab active px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2"><i class="fas fa-utensils"></i> 菜单管理</button>
                <button data-tab="orders" class="nav-tab px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2"><i class="fas fa-receipt"></i> 订单记录</button>
                <button data-tab="settings" class="nav-tab px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2"><i class="fas fa-sliders-h"></i> 餐厅设置</button>
                <button data-tab="logout" class="nav-tab px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2 text-stone-600 hover:bg-stone-100"><i class="fas fa-sign-out-alt"></i> 退出</button>
            </div>
            <div class="bg-amber-50/70 rounded-full px-4 py-2 text-xs text-amber-800 flex items-center gap-2 shadow-sm">
                <i class="fas fa-trash-alt text-amber-600"></i>
                <span>近期已归档 <strong id="deletedCountSpan">14</strong> 条过期订单</span>
                <button id="clearArchiveToastBtn" class="ml-2 text-amber-700 hover:text-amber-900 text-xs underline">标记已读</button>
            </div>
        </div>

        <!-- 菜单管理主区域（默认显示） -->
        <div id="menuPanel" class="transition-all duration-300">
            <!-- 高级筛选栏 -->
            <div class="mb-8 flex flex-wrap gap-3 items-end bg-white/50 backdrop-blur-sm p-4 rounded-2xl border border-stone-100/80 shadow-sm">
                <div class="flex-1 min-w-[160px]">
                    <label class="block text-xs font-semibold text-stone-500 mb-1"><i class="fas fa-tag mr-1"></i> 分类筛选</label>
                    <select id="categoryFilter" class="w-full rounded-xl border-stone-200 bg-white py-2.5 px-3 text-sm shadow-sm focus:border-orange-300 transition">
                        <option value="all">全部分类</option>
                        <option value="中餐">中餐</option>
                        <option value="凉菜">凉菜</option>
                        <option value="热菜">热菜</option>
                        <option value="汤品">汤品</option>
                        <option value="ethan">ethan</option>
                        <option value="撒旦">撒旦</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-semibold text-stone-500 mb-1"><i class="fas fa-search"></i> 菜名搜索</label>
                    <input type="text" id="dishNameSearch" placeholder="输入菜品名称..." class="filter-input w-full rounded-xl border-stone-200 bg-white py-2.5 px-3 text-sm">
                </div>
                <div class="flex-1 min-w-[140px]">
                    <label class="block text-xs font-semibold text-stone-500 mb-1"><i class="fas fa-filter"></i> 状态筛选</label>
                    <select id="statusFilter" class="w-full rounded-xl border-stone-200 bg-white py-2.5 px-3 text-sm">
                        <option value="all">全部状态</option>
                        <option value="active">可点</option>
                        <option value="inactive">已下架</option>
                    </select>
                </div>
                <div>
                    <button id="resetFiltersBtn" class="mt-5 px-5 py-2.5 rounded-xl bg-stone-100 text-stone-700 text-sm font-medium hover:bg-stone-200 transition flex items-center gap-2"><i class="fas fa-undo-alt"></i> 重置筛选</button>
                </div>
            </div>

            <!-- 分类菜品区块 (动态渲染) -->
            <div id="categoriesContainer" class="space-y-8">
                <!-- 动态内容由js生成 -->
            </div>

            <!-- 底部快速添加分类 -->
            <div class="mt-10 flex justify-center">
                <button id="quickAddCategoryBtn" class="bg-white/90 border border-dashed border-amber-300 rounded-2xl px-6 py-3 text-sm font-medium text-amber-700 hover:bg-amber-50 transition shadow-sm flex items-center gap-2"><i class="fas fa-plus-circle"></i> 新建分类 +</button>
            </div>
        </div>

        <!-- 订单记录面板 (模拟数据) -->
        <div id="ordersPanel" class="hidden transition-all duration-300">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6 text-center">
                <i class="fas fa-receipt text-5xl text-stone-300 mb-3"></i>
                <h3 class="text-xl font-semibold text-stone-800">订单历史记录</h3>
                <p class="text-stone-500 mt-1">近期待办订单: <strong class="text-amber-600">12</strong> 单</p>
                <div class="mt-6 flex flex-col gap-3 max-h-96 overflow-y-auto">
                    <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl"><span>📋 用户: 张三 · 宫保鸡丁+酸梅汤</span><span class="text-xs text-stone-400">19:30 未处理</span></div>
                    <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl"><span>📋 用户: 李四 · 扬州炒饭+毛血旺</span><span class="text-xs text-stone-400">19:15 待接单</span></div>
                    <div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl"><span>📋 用户: 王芳 · 夫妻肺片+冰镇酸梅汤</span><span class="text-xs text-stone-400">18:50 已完成</span></div>
                </div>
                <button class="mt-6 text-sm text-orange-600 hover:underline">查看完整订单报表 →</button>
            </div>
        </div>

        <!-- 设置面板 -->
        <div id="settingsPanel" class="hidden transition-all duration-300">
            <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-6">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-cog text-amber-500"></i> 餐厅偏好设置</h3>
                <div class="mt-4 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3"><span>营业中状态</span><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">营业中</span></div>
                    <div class="flex justify-between items-center border-b pb-3"><span>自动清理过期订单</span><label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" class="sr-only peer" checked><div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-orange-500"></div></label></div>
                    <div><button class="bg-stone-800 text-white px-5 py-2 rounded-xl text-sm">保存偏好</button></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast提示组件 -->
    <div id="adminToast" class="toast-message"></div>

    <script>
        // ---------- 高级菜单数据 (完整模拟) ----------
        const DISHES_DB = [
            { id: 1, name: "扬州炒饭", category: "中餐", price: 28, status: "active", tags: "招牌", icon: "fa-egg", gradient: "from-amber-100 to-orange-100" },
            { id: 2, name: "宫保鸡丁", category: "热菜", price: 42, status: "active", tags: "辣", icon: "fa-drumstick-bite", gradient: "from-red-100 to-rose-100" },
            { id: 3, name: "松鼠桂鱼", category: "热菜", price: 68, status: "active", tags: "酸甜", icon: "fa-fish", gradient: "from-sky-100 to-blue-100" },
            { id: 4, name: "酸辣土豆丝", category: "凉菜", price: 16, status: "active", tags: "酸辣", icon: "fa-pepper-hot", gradient: "from-lime-100 to-green-100" },
            { id: 5, name: "桂花糯米藕", category: "凉菜", price: 22, status: "active", tags: "甜", icon: "fa-seedling", gradient: "from-purple-100 to-pink-100" },
            { id: 6, name: "番茄蛋花汤", category: "汤品", price: 18, status: "active", tags: "清淡", icon: "fa-mug-hot", gradient: "from-yellow-100 to-orange-100" },
            { id: 7, name: "毛血旺", category: "热菜", price: 58, status: "active", tags: "麻辣", icon: "fa-pepper", gradient: "from-red-200 to-orange-200" },
            { id: 8, name: "夫妻肺片", category: "凉菜", price: 35, status: "active", tags: "香辣", icon: "fa-bowl-food", gradient: "from-stone-100 to-neutral-100" },
            { id: 9, name: "蒜蓉西兰花", category: "热菜", price: 22, status: "active", tags: "蒜香", icon: "fa-leaf", gradient: "from-emerald-100 to-teal-100" },
            { id: 10, name: "冰镇酸梅汤", category: "汤品", price: 12, status: "active", tags: "冰饮", icon: "fa-wine-bottle", gradient: "from-indigo-100 to-blue-100" },
            { id: 11, name: "葱油拌面", category: "中餐", price: 18, status: "active", tags: "葱香", icon: "fa-utensils", gradient: "from-amber-50 to-yellow-100" },
            { id: 12, name: "秘制烤翅", category: "热菜", price: 32, status: "active", tags: "烧烤", icon: "fa-drumstick-bite", gradient: "from-orange-100 to-amber-100" },
            { id: 13, name: "啊实打实", category: "中餐", price: 24, status: "inactive", tags: "隐藏", icon: "fa-bowl-rice", gradient: "from-stone-100 to-gray-100" },
            { id: 14, name: "嗡嗡嗡", category: "凉菜", price: 19, status: "active", tags: "特调", icon: "fa-honey-pot", gradient: "from-yellow-100 to-amber-100" },
            { id: 15, name: "对方是否", category: "热菜", price: 36, status: "active", tags: "创新", icon: "fa-question", gradient: "from-slate-100 to-zinc-100" },
            { id: 16, name: "撒旦撒", category: "汤品", price: 15, status: "active", tags: "养生", icon: "fa-flask", gradient: "from-violet-100 to-fuchsia-100" }
        ];

        let dishes = [...DISHES_DB];   // 可变数据 (支持下架/上架模拟)
        let deletedOrdersCount = 14;   // 模拟订单删除数

        // DOM 元素
        const container = document.getElementById('categoriesContainer');
        const categoryFilter = document.getElementById('categoryFilter');
        const dishNameSearch = document.getElementById('dishNameSearch');
        const statusFilter = document.getElementById('statusFilter');
        const resetBtn = document.getElementById('resetFiltersBtn');
        const menuPanel = document.getElementById('menuPanel');
        const ordersPanel = document.getElementById('ordersPanel');
        const settingsPanel = document.getElementById('settingsPanel');
        const navTabs = document.querySelectorAll('.nav-tab');
        const toastEl = document.getElementById('adminToast');
        const clearArchiveBtn = document.getElementById('clearArchiveToastBtn');
        const deletedCountSpan = document.getElementById('deletedCountSpan');

        // Toast函数
        function showToast(text, duration = 1800) {
            toastEl.innerText = text;
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, duration);
        }

        // 更新删除计数UI
        function updateArchiveBadge() {
            deletedCountSpan.innerText = deletedOrdersCount;
        }
        clearArchiveBtn.addEventListener('click', () => {
            if (deletedOrdersCount > 0) {
                deletedOrdersCount = 0;
                updateArchiveBadge();
                showToast('🧹 归档记录已清空', 1200);
            } else {
                showToast('暂无未读归档', 1000);
            }
        });

        // 菜品状态切换 (上架/下架)
        function toggleDishStatus(dishId) {
            const dish = dishes.find(d => d.id === dishId);
            if (dish) {
                dish.status = dish.status === 'active' ? 'inactive' : 'active';
                showToast(`✨ ${dish.name} 已${dish.status === 'active' ? '上架' : '下架'}`, 1000);
                renderMenuManagement(); // 重新渲染
            }
        }

        // 快速添加菜品 (演示)
        function quickAddDish(categoryName) {
            const newId = Date.now();
            const newDish = {
                id: newId,
                name: `新菜品${Math.floor(Math.random()*100)}`,
                category: categoryName,
                price: Math.floor(Math.random() * 40) + 18,
                status: "active",
                tags: "尝鲜",
                icon: "fa-plus-circle",
                gradient: "from-stone-100 to-stone-200"
            };
            dishes.push(newDish);
            showToast(`➕ 在「${categoryName}」分类新增菜品: ${newDish.name}`, 1500);
            renderMenuManagement();
        }

        // 删除菜品
        function deleteDish(dishId) {
            const dish = dishes.find(d => d.id === dishId);
            if (dish && confirm(`确定要将 "${dish.name}" 从菜单移除吗？`)) {
                dishes = dishes.filter(d => d.id !== dishId);
                showToast(`🗑️ 已删除菜品: ${dish.name}`, 1500);
                renderMenuManagement();
            }
        }

        // 渲染管理员菜单 (带筛选)
        function renderMenuManagement() {
            let filteredDishes = [...dishes];
            const catVal = categoryFilter.value;
            const searchVal = dishNameSearch.value.trim().toLowerCase();
            const statusVal = statusFilter.value;

            if (catVal !== 'all') {
                filteredDishes = filteredDishes.filter(d => d.category === catVal);
            }
            if (searchVal !== '') {
                filteredDishes = filteredDishes.filter(d => d.name.toLowerCase().includes(searchVal));
            }
            if (statusVal !== 'all') {
                filteredDishes = filteredDishes.filter(d => d.status === statusVal);
            }

            // 分组展示
            const categoriesMap = new Map();
            filteredDishes.forEach(dish => {
                if (!categoriesMap.has(dish.category)) categoriesMap.set(dish.category, []);
                categoriesMap.get(dish.category).push(dish);
            });

            // 按照自定义顺序展示
            const orderMap = ["中餐", "凉菜", "热菜", "汤品", "ethan", "撒旦"];
            let sortedCategories = Array.from(categoriesMap.keys()).sort((a,b) => {
                let idxA = orderMap.indexOf(a);
                let idxB = orderMap.indexOf(b);
                if(idxA === -1) idxA = 999;
                if(idxB === -1) idxB = 999;
                return idxA - idxB;
            });

            if (sortedCategories.length === 0) {
                container.innerHTML = `<div class="text-center py-16 bg-white/50 rounded-2xl border border-dashed"><i class="fas fa-search text-4xl text-stone-300"></i><p class="mt-2 text-stone-500">没有找到匹配的菜品，调整筛选条件试试～</p></div>`;
                return;
            }

            let html = '';
            for (let cat of sortedCategories) {
                const items = categoriesMap.get(cat);
                html += `
                    <div class="admin-card bg-white rounded-2xl p-5 shadow-sm border border-stone-100/80 transition-all">
                        <div class="flex flex-wrap justify-between items-center mb-4">
                            <div class="flex items-center gap-2">
                                <div class="w-1.5 h-6 bg-orange-400 rounded-full"></div>
                                <h2 class="text-xl font-bold text-stone-800">${cat}</h2>
                                <span class="bg-stone-100 text-stone-500 text-xs px-2 py-0.5 rounded-full">${items.length} 道</span>
                            </div>
                            <button onclick="quickAddDish('${cat}')" class="text-xs bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-full flex items-center gap-1 transition"><i class="fas fa-plus-circle text-amber-500"></i> 新增菜品</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                `;
                items.forEach(dish => {
                    const isActive = dish.status === 'active';
                    html += `
                        <div class="group rounded-xl border ${isActive ? 'border-stone-100' : 'border-stone-200 bg-stone-50/40'} hover:shadow-md transition-all duration-200 overflow-hidden">
                            <div class="relative h-32 bg-gradient-to-br ${dish.gradient} flex items-center justify-center">
                                <i class="fas ${dish.icon} text-5xl text-stone-700/60 drop-shadow-sm"></i>
                                <div class="absolute top-2 right-2">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'} shadow-sm">
                                        ${isActive ? '可点' : '已下架'}
                                    </span>
                                </div>
                            </div>
                            <div class="p-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-stone-800">${dish.name}</h3>
                                        <p class="text-xs text-stone-400 mt-0.5">${dish.tags || '经典风味'}</p>
                                    </div>
                                    <span class="text-orange-600 font-bold">¥${dish.price}</span>
                                </div>
                                <div class="flex justify-between items-center mt-3">
                                    <button onclick="toggleDishStatus(${dish.id})" class="toggle-status text-xs px-3 py-1 rounded-full border ${isActive ? 'bg-green-50 text-green-700 border-green-200' : 'bg-stone-100 text-stone-500 border-stone-200'} hover:scale-105 transition flex items-center gap-1">
                                        <i class="fas ${isActive ? 'fa-toggle-on' : 'fa-toggle-off'}"></i> ${isActive ? '上架中' : '下架'}
                                    </button>
                                    <button onclick="deleteDish(${dish.id})" class="text-stone-400 hover:text-red-500 transition text-sm"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        // 重置筛选
        function resetFilters() {
            categoryFilter.value = 'all';
            dishNameSearch.value = '';
            statusFilter.value = 'all';
            renderMenuManagement();
            showToast('筛选已重置', 800);
        }

        // 选项卡切换
        function switchTab(tabId) {
            // 更新按钮样式
            navTabs.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('active');
                } else if (tabId === 'menu' && btn.getAttribute('data-tab') === 'menu') {
                    btn.classList.add('active');
                }
            });
            // 显示面板
            menuPanel.classList.add('hidden');
            ordersPanel.classList.add('hidden');
            settingsPanel.classList.add('hidden');
            if (tabId === 'menu') menuPanel.classList.remove('hidden');
            if (tabId === 'orders') ordersPanel.classList.remove('hidden');
            if (tabId === 'settings') settingsPanel.classList.remove('hidden');
            if (tabId === 'logout') {
                showToast('👋 安全退出管理后台', 1200);
                setTimeout(() => {
                    location.reload(); // 演示刷新
                }, 800);
            }
        }

        // 监听新建分类
        document.getElementById('quickAddCategoryBtn').addEventListener('click', () => {
            let newCat = prompt('请输入新分类名称 (例如: 甜品)', '创意菜');
            if (newCat && newCat.trim()) {
                const catName = newCat.trim();
                // 添加一个示例菜品到新分类
                const demoDish = {
                    id: Date.now(),
                    name: `${catName}示例菜`,
                    category: catName,
                    price: 29,
                    status: "active",
                    tags: "新品",
                    icon: "fa-star",
                    gradient: "from-purple-100 to-pink-100"
                };
                dishes.push(demoDish);
                renderMenuManagement();
                showToast(`🎉 分类「${catName}」已创建，并添加示例菜品`, 1800);
            }
        });

        // 绑定事件
        categoryFilter.addEventListener('change', () => renderMenuManagement());
        dishNameSearch.addEventListener('input', () => renderMenuManagement());
        statusFilter.addEventListener('change', () => renderMenuManagement());
        resetBtn.addEventListener('click', resetFilters);
        navTabs.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = btn.getAttribute('data-tab');
                if (tab) switchTab(tab);
            });
        });

        // 模拟设置保存
        document.querySelector('#settingsPanel button')?.addEventListener('click', () => showToast('⚙️ 设置已保存 (演示)', 1000));

        // 初始渲染
        renderMenuManagement();
        updateArchiveBadge();

        // 附加: 让所有的函数暴露到全局 (用于 onclick)
        window.toggleDishStatus = toggleDishStatus;
        window.deleteDish = deleteDish;
        window.quickAddDish = quickAddDish;
    </script>
</body>
</html>
