services:
  app:
    image: ghcr.io/panyiliu/friends-menu:main
    container_name: friends-menu
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      # NOTE: ADMIN_SESSION_SECRET 由 entrypoint 自动生成（避免用户必须创建 .env）
      - REQUIRE_NON_DEFAULT_ADMIN_PASSWORD=${REQUIRE_NON_DEFAULT_ADMIN_PASSWORD:-false}
      - AUTO_SEED_IF_EMPTY=${AUTO_SEED_IF_EMPTY:-true}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-}
      - INTERNAL_BASE_URL=${INTERNAL_BASE_URL:-}
    restart: unless-stopped
    volumes:
      - friends-menu-data:/app/data
      - friends-menu-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: friends-menu-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
    command: --label-enable

volumes:
  friends-menu-data:
  friends-menu-uploads:
